<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Spendry Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
     <link rel="stylesheet" href="css/index.css">

</head>
<body>
    <div class="sidebar">
        <div class="logo">Spendry</div>
        <ul class="menu">
            <li class="menu-item active"><a href="index.html"><i class='bx bxs-dashboard'></i><span>Dashboard</span></a></li>
            <li class="menu-item"><a href="expense.html"><i class='bx bx-receipt'></i><span>Expenses</span></a></li>
            <li class="menu-item"><a href="split-bill.html"><i class='bx bx-group'></i><span>Split Bills</span></a></li>
            <li class="menu-item"><a href="budget-management.html"><i class='bx bx-bar-chart-alt'></i><span>Budgets</span></a></li>
            <li class="menu-item"><a href="#"><i class='bx bx-cog'></i><span>Settings</span></a></li>
        </ul>
    </div>
    <div class="main-content">
        <header>
            <div>
                <h1>Dashboard</h1>
                <p id="welcomeMessage" style="color: #666;">Welcome back! Here’s your financial overview.</p>
            </div>
            <div class="header-right">
                <div class="top-bar-icons">
                    <i class='bx bx-bell'></i>
                    <div class="user-profile" id="userInitial">A</div>
                </div>
                <button class="logout-btn" id="logoutBtn">
                    <i class='bx bx-log-out' style="margin-right: 5px;"></i>Logout
                </button>
                <button class="export-btn" id="exportBtn">Export Report</button>
            </div>
        </header>
        <div class="cards" id="summaryCards">
            <!-- Populated by JS -->
        </div>
        <div class="chart-section">
            <div class="chart">
                <h3>Monthly Expenses</h3>
                <p>Your personal and group expenses over time</p>
                <canvas id="barChart" height="120"></canvas>
            </div>
            <div class="category">
                <h3>This Month's Categories</h3>
                <p>Breakdown of your spending</p>
                <canvas id="pieChart" height="180"></canvas>
            </div>
        </div>
        <div class="bottom">
            <div class="recent">
                <h3>Recent Expenses</h3>
                <div class="expense-list" id="recentExpenses"></div>
            </div>
            <div class="quick">
                <h3>Quick Stats</h3>
                <div id="quickStats"></div>
            </div>
        </div>
    </div>
   

     <script type="module" src="./js/index.js"></script>
</body>
</html>
