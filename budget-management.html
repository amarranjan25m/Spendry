<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Manager - Spendry</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/budget.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo">Spendry</div>
        <ul class="menu">
            <li class="menu-item"><a href="index.html"><i class='bx bxs-dashboard'></i><span>Dashboard</span></a></li>
            <li class="menu-item"><a href="expense.html"><i class='bx bx-receipt'></i><span>Expenses</span></a></li>
            <li class="menu-item"><a href="split-bill.html"><i class='bx bx-group'></i><span>Split Bills</span></a></li>
            <li class="menu-item active"><a href="budget-management.html"><i class='bx bx-bar-chart-alt'></i><span>Budgets</span></a></li>
            <li class="menu-item"><a href="#"><i class='bx bx-cog'></i><span>Settings</span></a></li>
        </ul>
    </div>
    <div class="main-content">
        <div class="top-bar">
            <i class='bx bx-bell'></i>
            <div class="user-profile" id="userInitial">A</div>
        </div>
        <div class="header">
            <div class="header-title">
                <h1>Budget Manager</h1>
                <p>Set and track your spending limits by category</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" id="addBudgetBtn">Add Budget</button>
            </div>
        </div>
        <div class="summary-cards" id="summaryCards">
            <!-- Populated by JS -->
        </div>
        <div class="budget-overview">
            <h2>Budget Overview</h2>
            <p class="subtext">Your current spending progress across all categories</p>
            <div class="overall-progress">
                <span>Overall Progress</span>
                <span id="overallProgressText"></span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="overallProgressBar" style="width: 0%;"></div>
            </div>
        </div>
        <div class="budget-categories" id="budgetCategories">
            <!-- Populated by JS -->
        </div>
    </div>
    <!-- Modal for Add Budget -->
    <div class="modal-bg" id="budgetModalBg">
        <div class="modal">
            <h2>Add Budget Category</h2>
            <div id="modalError" class="error-msg"></div>
            <form id="budgetForm" autocomplete="off">
                <label for="category">Category Name</label>
                <input type="text" id="category" required placeholder="e.g. Groceries">
                <label for="limit">Monthly Limit (₹)</label>
                <input type="number" id="limit" required min="1" placeholder="e.g. 10000">
                <label for="spent">Spent (₹)</label>
                <input type="number" id="spent" required min="0" placeholder="e.g. 0">
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" id="cancelModalBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add</button>
                </div>
            </form>
        </div>
    </div>
  
       <script type="module" src="./js/budget.js"></script>
</body>
</html>
