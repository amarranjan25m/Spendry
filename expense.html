<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker - Spendry</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/expense.css">
  
</head>
<body>

    <div class="sidebar">
        <div class="logo">Spendry</div>
        <ul class="menu">
            <li class="menu-item"><a href="index.html"><i class='bx bxs-dashboard'></i><span>Dashboard</span></a></li>
            <li class="menu-item active"><a href="expense.html"><i class='bx bx-receipt'></i><span>Expenses</span></a></li>
            <li class="menu-item"><a href="split-bill.html"><i class='bx bx-group'></i><span>Split Bills</span></a></li>
            <li class="menu-item"><a href="budget-management.html"><i class='bx bx-bar-chart-alt'></i><span>Budgets</span></a></li>
            <li class="menu-item"><a href="#"><i class='bx bx-cog'></i><span>Settings</span></a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <i class='bx bx-bell'></i>
            <div class="user-profile">A</div>
        </div>

        <div class="header">
            <div class="header-title">
                <h1>Expense Tracker</h1>
                <p>Track and manage your personal expenses</p>
            </div>
            <div class="header-actions">
                <button class="btn"><i class='bx bx-export' style="margin-right: 5px;"></i> Export PDF</button>
                <button class="btn btn-primary" id="addExpenseBtn"><i class='bx bx-plus' style="margin-right: 5px;"></i> Add Expense</button>
            </div>
        </div>

        <div class="summary-cards" id="summaryCards">
            <div class="card">
                <h3>Total Expenses</h3>
                <div class="value" id="totalExpenses">₹0</div>
                <div class="subtext" id="totalCount">0 expense</div>
            </div>
            <div class="card">
                <h3>Top Category</h3>
                <div class="value" id="topCategory">-</div>
                <div class="subtext" id="topCategoryAmount">₹0</div>
            </div>
            <div class="card">
                <h3>Average Expense</h3>
                <div class="value" id="avgExpense">₹0</div>
                <div class="subtext">Per transaction</div>
            </div>
        </div>

        <div class="filters-search">
            <div class="search-box">
                <i class='bx bx-search'></i>
                <input type="text" id="searchInput" placeholder="Search expenses...">
            </div>
            <div class="filter-options">
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="Travel">Travel</option>
                    <option value="Food">Food</option>
                    <option value="Shopping">Shopping</option>
                </select>
                <select id="sortFilter">
                    <option value="dateDesc">Sort by Date</option>
                    <option value="amountDesc">Amount: High to Low</option>
                    <option value="amountAsc">Amount: Low to High</option>
                </select>
            </div>
        </div>

        <div class="expenses-container">
            <h2>Expenses <span style="font-weight: 400; color: var(--text-light); font-size: 0.9rem;" id="expenseCount"></span></h2>
            <div id="expensesList"></div>
        </div>
    </div>

    <!-- Expense Modal -->
    <div class="modal" id="expenseModal">
        <div class="modal-content">
            <span class="modal-close" id="closeModalBtn">&times;</span>
            <h2>Add Expense</h2>
            <div class="modal-error" id="modalError"></div>
            <form id="expenseForm" autocomplete="off">
                <label for="expenseTitle">Title</label>
                <input type="text" id="expenseTitle" required maxlength="50" placeholder="e.g. Grocery Shopping">

                <label for="expenseAmount">Amount (₹)</label>
                <input type="number" id="expenseAmount" required min="1" placeholder="e.g. 500">

                <label for="expenseCategory">Category</label>
                <select id="expenseCategory" required>
                    <option value="">Select Category</option>
                    <option value="Travel">Travel</option>
                    <option value="Food">Food</option>
                    <option value="Shopping">Shopping</option>
                </select>

                <label for="expenseDate">Date</label>
                <input type="date" id="expenseDate" required>

                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" id="cancelModalBtn">Cancel</button>
                    <button type="submit" class="btn btn-add">Add</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs (modular style) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyBSFQmoSeZFWuAAa1FlRh-0KFhAj9wjQDQ",
            authDomain: "spendry-83327.firebaseapp.com",
            projectId: "spendry-83327",
            storageBucket: "spendry-83327.appspot.com",
            messagingSenderId: "423479822230",
            appId: "1:423479822230:web:6b588326c585cda714bfb7",
            measurementId: "G-Z2Z0N7LBZX"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let allExpenses = [];

        // Modal logic
        const expenseModal = document.getElementById('expenseModal');
        const addExpenseBtn = document.getElementById('addExpenseBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const expenseForm = document.getElementById('expenseForm');
        const modalError = document.getElementById('modalError');

        function openModal() {
            expenseModal.classList.add('active');
            modalError.textContent = '';
            expenseForm.reset();
            document.getElementById('expenseDate').value = new Date().toISOString().slice(0,10);
        }
        function closeModal() {
            expenseModal.classList.remove('active');
        }
        addExpenseBtn.onclick = openModal;
        closeModalBtn.onclick = closeModal;
        cancelModalBtn.onclick = closeModal;
        window.onclick = function(event) {
            if (event.target === expenseModal) closeModal();
        };

        // Render expenses
        function renderExpenses(expenses) {
            const expensesList = document.getElementById('expensesList');
            const expenseCount = document.getElementById('expenseCount');
            expensesList.innerHTML = '';
            if (!expenses.length) {
                expensesList.innerHTML = `<div style="color:#888; padding:20px 0;">No expenses found.</div>`;
                expenseCount.textContent = '';
                updateSummaryCards([]);
                return;
            }
            expenses.forEach(exp => {
                expensesList.innerHTML += `
                    <div class="expense-item">
                        <div class="expense-details">
                            <div class="title">${exp.title}</div>
                            <div class="category">${exp.category}</div>
                        </div>
                        <div class="expense-amount">
                            <div class="amount">₹${Number(exp.amount).toLocaleString()}</div>
                            <div class="date">${formatDate(exp.date)}</div>
                        </div>
                    </div>
                `;
            });
            expenseCount.textContent = `Showing ${expenses.length} expense${expenses.length > 1 ? 's' : ''}`;
            updateSummaryCards(expenses);
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            if (isNaN(d)) return dateStr;
            return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        // Summary cards
        function updateSummaryCards(expenses) {
            const total = expenses.reduce((sum, e) => sum + Number(e.amount), 0);
            document.getElementById('totalExpenses').textContent = `₹${total.toLocaleString()}`;
            document.getElementById('totalCount').textContent = `${expenses.length} expense${expenses.length > 1 ? 's' : ''}`;
            if (expenses.length) {
                // Top category
                const catMap = {};
                expenses.forEach(e => {
                    catMap[e.category] = (catMap[e.category] || 0) + Number(e.amount);
                });
                let topCat = '', topAmt = 0;
                for (const cat in catMap) {
                    if (catMap[cat] > topAmt) {
                        topCat = cat;
                        topAmt = catMap[cat];
                    }
                }
                document.getElementById('topCategory').textContent = topCat;
                document.getElementById('topCategoryAmount').textContent = `₹${topAmt.toLocaleString()}`;
                document.getElementById('avgExpense').textContent = `₹${Math.round(total/expenses.length).toLocaleString()}`;
            } else {
                document.getElementById('topCategory').textContent = '-';
                document.getElementById('topCategoryAmount').textContent = '₹0';
                document.getElementById('avgExpense').textContent = '₹0';
            }
        }

        // Fetch expenses from Firestore
        async function fetchExpenses() {
            if (!currentUser) return;
            let q = query(
                collection(db, "expenses"),
                where("uid", "==", currentUser.uid)
            );
            const querySnapshot = await getDocs(q);
            allExpenses = [];
            querySnapshot.forEach(doc => {
                allExpenses.push({ id: doc.id, ...doc.data() });
            });
            applyFiltersAndRender();
        }

        // Add expense to Firestore
        expenseForm.onsubmit = async function(e) {
            e.preventDefault();
            modalError.textContent = '';
            const title = document.getElementById('expenseTitle').value.trim();
            const amount = Number(document.getElementById('expenseAmount').value);
            const category = document.getElementById('expenseCategory').value;
            const date = document.getElementById('expenseDate').value;
            if (!title || !amount || !category || !date) {
                modalError.textContent = "All fields are required.";
                return;
            }
            try {
                await addDoc(collection(db, "expenses"), {
                    uid: currentUser.uid,
                    title,
                    amount,
                    category,
                    date
                });
                closeModal();
                await fetchExpenses();
            } catch (err) {
                modalError.textContent = "Failed to add expense. Try again.";
            }
        };

        // Filtering and sorting
        function applyFiltersAndRender() {
            let filtered = [...allExpenses];
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            const cat = document.getElementById('categoryFilter').value;
            const sort = document.getElementById('sortFilter').value;
            if (search) {
                filtered = filtered.filter(e =>
                    e.title.toLowerCase().includes(search) ||
                    e.category.toLowerCase().includes(search)
                );
            }
            if (cat) {
                filtered = filtered.filter(e => e.category === cat);
            }
            if (sort === 'dateDesc') {
                filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
            } else if (sort === 'amountDesc') {
                filtered.sort((a, b) => b.amount - a.amount);
            } else if (sort === 'amountAsc') {
                filtered.sort((a, b) => a.amount - b.amount);
            }
            renderExpenses(filtered);
        }
        document.getElementById('searchInput').oninput = applyFiltersAndRender;
        document.getElementById('categoryFilter').onchange = applyFiltersAndRender;
        document.getElementById('sortFilter').onchange = applyFiltersAndRender;

        // Auth check and fetch
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
            } else {
                currentUser = user;
                await fetchExpenses();
            }
        });
    </script>
</body>
</html>
