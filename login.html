<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to Spendry</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <div class="login-container">
        <div class="logo-box">S</div>
        <h1>Welcome to Spendry</h1>
        <p>Manage your finances and split expenses with ease</p>
        <div class="auth-switch">
            <div class="auth-switch-btn active" id="signInBtn">Sign In</div>
            <div class="auth-switch-btn" id="signUpBtn">Sign Up</div>
        </div>
        <div id="msg"></div>
        <form id="authForm" autocomplete="off">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
            <button type="submit" class="btn-submit" id="submitButton">Sign In</button>
        </form>
    </div>

    <script type="module" src="./js/login.js"></script>
</body>
</html>
